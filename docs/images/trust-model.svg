<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
  </defs>

  <!-- background (readable in GitHub dark mode) -->
  <rect x="0" y="0" width="900" height="400" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- CA -->
  <rect x="300" y="28" width="300" height="96" rx="12" fill="#fff6e0" stroke="#b7791f" stroke-width="2"/>
  <text x="450" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#5a3a05">Certificate Authority</text>
  <text x="450" y="82" text-anchor="middle" font-size="13" fill="#6b4a0e">ca.key: stays on my PC, never copied</text>
  <text x="450" y="102" text-anchor="middle" font-size="13" fill="#6b4a0e">ca.crt: public, given to every client</text>

  <!-- signing lines -->
  <path d="M450,124 L450,206" fill="none" stroke="#b7791f" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M450,160 L165,160 L165,206" fill="none" stroke="#b7791f" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M450,160 L735,160 L735,206" fill="none" stroke="#b7791f" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="300" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#6b4a0e">signs</text>
  <text x="600" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#6b4a0e">signs</text>
  <text x="462" y="186" font-size="12" font-weight="600" fill="#6b4a0e">signs</text>

  <!-- server certificate -->
  <rect x="40" y="208" width="250" height="110" rx="12" fill="#e8f7f0" stroke="#1a7f5a" stroke-width="2"/>
  <text x="165" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#0d3b2b">Server certificate</text>
  <text x="165" y="257" text-anchor="middle" font-size="13" fill="#24493b">used by the Mosquitto broker</text>
  <text x="165" y="282" text-anchor="middle" font-size="12" fill="#24493b">serverAuth · SAN: name + IP</text>
  <text x="165" y="302" text-anchor="middle" font-size="12" fill="#24493b">proves: "I am the broker"</text>

  <!-- client certificate: ESP32 -->
  <rect x="325" y="208" width="250" height="110" rx="12" fill="#eaf2ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="450" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#0b2a5b">Client certificate</text>
  <text x="450" y="257" text-anchor="middle" font-size="13" fill="#2b3a55">used by the ESP32</text>
  <text x="450" y="282" text-anchor="middle" font-size="12" fill="#2b3a55">clientAuth · CN = device name</text>
  <text x="450" y="302" text-anchor="middle" font-size="12" fill="#2b3a55">proves: "I am this device"</text>

  <!-- client certificate: MQTT Explorer -->
  <rect x="610" y="208" width="250" height="110" rx="12" fill="#f3eefe" stroke="#8250df" stroke-width="2"/>
  <text x="735" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#3b1d73">Client certificate</text>
  <text x="735" y="257" text-anchor="middle" font-size="13" fill="#493a66">used by MQTT Explorer</text>
  <text x="735" y="282" text-anchor="middle" font-size="12" fill="#493a66">clientAuth · CN = tool name</text>
  <text x="735" y="302" text-anchor="middle" font-size="12" fill="#493a66">proves: "I am this viewer"</text>

  <!-- rule at the bottom -->
  <rect x="40" y="342" width="820" height="40" rx="20" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="450" y="367" text-anchor="middle" font-size="13" fill="#24292f">Everyone trusts only ca.crt: a certificate not signed by this CA is rejected, on both sides.</text>
</svg>
