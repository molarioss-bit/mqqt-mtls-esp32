<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
  </defs>

  <!-- background (keeps the diagram readable in GitHub dark mode) -->
  <rect x="0" y="0" width="900" height="430" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- ESP32 -->
  <rect x="30" y="50" width="220" height="180" rx="12" fill="#eaf2ff" stroke="#1f6feb" stroke-width="2"/>
  <text x="140" y="82" text-anchor="middle" font-size="20" font-weight="700" fill="#0b2a5b">ESP32</text>
  <text x="140" y="106" text-anchor="middle" font-size="13" fill="#2b3a55">LDR · button · NTC</text>
  <rect x="50" y="122" width="180" height="26" rx="13" fill="#ffffff" stroke="#1f6feb"/>
  <text x="140" y="140" text-anchor="middle" font-size="12" fill="#0b2a5b">esp.crt + esp.key</text>
  <rect x="50" y="156" width="180" height="26" rx="13" fill="#ffffff" stroke="#1f6feb"/>
  <text x="140" y="174" text-anchor="middle" font-size="12" fill="#0b2a5b">trusts ca.crt only</text>
  <text x="140" y="208" text-anchor="middle" font-size="12" fill="#2b3a55">checks time over NTP first</text>

  <!-- Broker -->
  <rect x="340" y="50" width="220" height="180" rx="12" fill="#e8f7f0" stroke="#1a7f5a" stroke-width="2"/>
  <text x="450" y="82" text-anchor="middle" font-size="20" font-weight="700" fill="#0d3b2b">Mosquitto broker</text>
  <text x="450" y="106" text-anchor="middle" font-size="13" fill="#24493b">Docker on Windows</text>
  <rect x="360" y="122" width="180" height="26" rx="13" fill="#ffffff" stroke="#1a7f5a"/>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#0d3b2b">server.crt + server.key</text>
  <rect x="360" y="156" width="180" height="26" rx="13" fill="#ffffff" stroke="#1a7f5a"/>
  <text x="450" y="174" text-anchor="middle" font-size="12" fill="#0d3b2b">require_certificate true</text>
  <text x="450" y="208" text-anchor="middle" font-size="12" fill="#24493b">TLS 1.2 · port 8883</text>

  <!-- MQTT Explorer -->
  <rect x="650" y="50" width="220" height="180" rx="12" fill="#f3eefe" stroke="#8250df" stroke-width="2"/>
  <text x="760" y="82" text-anchor="middle" font-size="20" font-weight="700" fill="#3b1d73">MQTT Explorer</text>
  <text x="760" y="106" text-anchor="middle" font-size="13" fill="#493a66">second client (viewer)</text>
  <rect x="670" y="122" width="180" height="26" rx="13" fill="#ffffff" stroke="#8250df"/>
  <text x="760" y="140" text-anchor="middle" font-size="12" fill="#3b1d73">own client certificate</text>
  <rect x="670" y="156" width="180" height="26" rx="13" fill="#ffffff" stroke="#8250df"/>
  <text x="760" y="174" text-anchor="middle" font-size="12" fill="#3b1d73">trusts ca.crt only</text>

  <!-- encrypted MQTT links -->
  <line x1="252" y1="140" x2="338" y2="140" stroke="#1f6feb" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="295" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1f6feb">mTLS</text>
  <text x="295" y="162" text-anchor="middle" font-size="11" fill="#57606a">publish</text>

  <line x1="562" y1="140" x2="648" y2="140" stroke="#1f6feb" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="605" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1f6feb">mTLS</text>
  <text x="605" y="162" text-anchor="middle" font-size="11" fill="#57606a">subscribe</text>

  <!-- CA -->
  <rect x="340" y="310" width="220" height="80" rx="12" fill="#fff6e0" stroke="#b7791f" stroke-width="2"/>
  <text x="450" y="342" text-anchor="middle" font-size="18" font-weight="700" fill="#5a3a05">Private CA</text>
  <text x="450" y="364" text-anchor="middle" font-size="12" fill="#6b4a0e">made by my Docker generator</text>
  <text x="450" y="380" text-anchor="middle" font-size="12" fill="#6b4a0e">ca.key never leaves my PC</text>

  <!-- certificate issuing (dashed) -->
  <path d="M450,310 L450,232" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <path d="M340,350 L140,350 L140,232" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <path d="M560,350 L760,350 L760,232" fill="none" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="462" y="272" font-size="11" fill="#6b4a0e">signs server cert</text>
  <text x="152" y="300" font-size="11" fill="#6b4a0e">signs device cert</text>
  <text x="772" y="300" font-size="11" fill="#6b4a0e">signs client cert</text>

  <!-- legend -->
  <line x1="30" y1="408" x2="70" y2="408" stroke="#1f6feb" stroke-width="3"/>
  <text x="78" y="412" font-size="12" fill="#57606a">encrypted MQTT, both sides verified</text>
  <line x1="330" y1="408" x2="370" y2="408" stroke="#b7791f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="378" y="412" font-size="12" fill="#57606a">certificate issued by the CA</text>
</svg>
